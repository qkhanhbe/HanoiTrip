name: App and Terraform CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-check:
    name: app-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev --engine-strict --registry=https://registry.npmjs.org/ --strict-ssl=true --no-audit --no-fund
      - run: npm run check
      - run: python3 -m unittest discover -s tests/ci -v

  browser-road-check:
    name: browser-road-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev --engine-strict --registry=https://registry.npmjs.org/ --strict-ssl=true --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser:road

  terraform-check:
    name: terraform-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive terraform
      - name: Validate bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
      - name: Validate app stack
        run: |
          terraform -chdir=terraform/app init -backend=false -input=false
          terraform -chdir=terraform/app validate

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Report pending cloud configuration
        if: ${{ vars.AZURE_TERRAFORM_PLAN_ENABLED != 'true' }}
        run: |
          echo "## Terraform plan pending" >> "$GITHUB_STEP_SUMMARY"
          echo "Set AZURE_TERRAFORM_PLAN_ENABLED=true only after the read-only PR OIDC identity and plan variables exist." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::No Azure plan was produced in this run; fmt/validate still run in terraform-check."
      - if: ${{ vars.AZURE_TERRAFORM_PLAN_ENABLED == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - if: ${{ vars.AZURE_TERRAFORM_PLAN_ENABLED == 'true' }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - if: ${{ vars.AZURE_TERRAFORM_PLAN_ENABLED == 'true' }}
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create reviewable plan
        if: ${{ vars.AZURE_TERRAFORM_PLAN_ENABLED == 'true' }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: 'true'
          TF_VAR_allowed_ip_cidrs: ${{ vars.AZURE_ALLOWED_IP_CIDRS_JSON }}
          TF_VAR_alert_email: ${{ vars.AZURE_ALERT_EMAIL }}
          TF_VAR_mysql_secret_expiration_date: ${{ vars.AZURE_MYSQL_SECRET_EXPIRATION_DATE }}
          TF_VAR_github_actions_principal_object_id: ${{ vars.AZURE_DEPLOY_PRINCIPAL_OBJECT_ID }}
        run: |
          terraform -chdir=terraform/app init -backend=false -input=false
          terraform -chdir=terraform/app plan -refresh=false -input=false \
            -out="$RUNNER_TEMP/hanoitrip.tfplan"
          terraform -chdir=terraform/app show -no-color "$RUNNER_TEMP/hanoitrip.tfplan" > "$RUNNER_TEMP/terraform-plan.txt"
          {
            echo "## Terraform review plan"
            echo "A real greenfield plan was generated with a read-only PR identity."
            echo "Remote state is intentionally not attached to untrusted PR code; this job never applies or deploys."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ vars.AZURE_TERRAFORM_PLAN_ENABLED == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: terraform-plan-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/terraform-plan.txt
          if-no-files-found: error
          retention-days: 7

  container-check:
    name: container-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      DIAGNOSTICS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate Dockerfile build (PR only, no push)
        run: docker build --file Dockerfile --build-arg "BUILD_SHA=$BUILD_SHA" --tag "hanoitrip:$BUILD_SHA" .
      - name: Start MySQL and smoke-test image without rebuilding
        run: |
          node scripts/setup-local.mjs
          docker compose up --no-build -d --wait
      - name: Probe SPA, API, MySQL and diagnostics
        env:
          SMOKE_WRITE: '1'
          SMOKE_DIAGNOSTICS: '1'
        run: node scripts/smoke.mjs
      - name: Scan runtime image
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/.trivyignore.yaml:/policy/.trivyignore.yaml:ro" \
            aquasec/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed=false --ignorefile /policy/.trivyignore.yaml \
            --timeout 10m "hanoitrip:$BUILD_SHA"
      - name: Clean up ephemeral containers
        if: ${{ always() }}
        run: docker compose down
